plugins {
    id 'java'
}

// ── Java 21 toolchain ────────────────────────────────────────────────────────
java {
    toolchain {
        def jv = findProperty('devJavaVersion') ?: '21'
        languageVersion = JavaLanguageVersion.of(jv as Integer)
    }
}

// ── Source sets ──────────────────────────────────────────────────────────────
// Main sources live directly in src/ (no package subdirectory)
sourceSets {
    main {
        java { srcDirs = ['src'] }
    }
    // Keep unit and integration tests as separate source sets so they can be
    // run independently, but both compile against the same main classes.
    unitTest {
        java { srcDirs = ['test/unit'] }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    integrationTest {
        java { srcDirs = ['test/integration'] }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// ── Dependencies ─────────────────────────────────────────────────────────────
repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5 for all test source sets
    testImplementation            'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly               'org.junit.platform:junit-platform-launcher'
    unitTestImplementation        'org.junit.jupiter:junit-jupiter:5.11.0'
    unitTestRuntimeOnly           'org.junit.platform:junit-platform-launcher'
    integrationTestImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    integrationTestRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

// ── Test tasks ───────────────────────────────────────────────────────────────
test {
    useJUnitPlatform()
    testClassesDirs = sourceSets.unitTest.output.classesDirs
    classpath       = sourceSets.unitTest.runtimeClasspath
    description     = 'Runs unit tests.'
}

tasks.register('integrationTest', Test) {
    useJUnitPlatform()
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath       = sourceSets.integrationTest.runtimeClasspath
    description     = 'Runs integration tests (requires a running server).'
    group           = 'verification'
    // Integration tests are deliberately excluded from the default 'check'
    // lifecycle so `./gradlew build` does not spin up sockets in CI.
    // Run explicitly with:  ./gradlew integrationTest
}

tasks.named('check') {
    dependsOn 'test'   // unit tests only
}

// ── Jar ──────────────────────────────────────────────────────────────────────
// Build produces two fat-jars so each side can be launched with `java -jar`.
tasks.register('serverJar', Jar) {
    archiveBaseName = 'server'
    from sourceSets.main.output
    manifest { attributes 'Main-Class': 'Server' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    description = 'Assembles a runnable server jar.'
    group       = 'build'
}

tasks.register('clientJar', Jar) {
    archiveBaseName = 'client'
    from sourceSets.main.output
    manifest { attributes 'Main-Class': 'Client' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    description = 'Assembles a runnable client jar.'
    group       = 'build'
}

tasks.named('assemble') {
    dependsOn 'serverJar', 'clientJar'
}

// ── Run tasks ────────────────────────────────────────────────────────────────
tasks.register('runServer', JavaExec) {
    classpath  = sourceSets.main.runtimeClasspath
    mainClass  = 'Server'
    description = 'Starts the chat server on port 1234.'
    group       = 'application'
    // Enable SSL:  ./gradlew runServer -Dssl=true
    systemProperties = System.properties
}

tasks.register('runClient', JavaExec) {
    classpath   = sourceSets.main.runtimeClasspath
    mainClass   = 'Client'
    standardInput = System.in          // forward terminal input to the client
    description = 'Starts an interactive chat client.'
    group       = 'application'
    systemProperties = System.properties
}

tasks.withType(JavaExec).configureEach {
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}
