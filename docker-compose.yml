services:
  # 1. The Ollama Engine
  ollama:
    image: ollama/ollama
    container_name: chat-ollama
    ports:
      - "11435:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=10
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama
    container_name: chat-ollama-init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    command: sh -c "sleep 5 && ollama pull gemma3:1b"

  server:
    build: .
    container_name: chat-server
    command: ["java", "-Dollama.url=http://ollama:11434", "-jar", "server.jar"]
    ports:
      - "1234:1234"
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama

  client:
    build: .
    command: ["java", "-jar", "client.jar", "server"]
    depends_on:
      - server
    stdin_open: true
    tty: true

volumes:
  ollama_data: